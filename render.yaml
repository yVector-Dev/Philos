# One-click deploy on Render: New → Blueprint → pick this repo.
databases:
  - name: philos-db
    plan: free

services:
  - type: web
    name: philos
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi --workers 3
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: philos-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: SITE_URL
        value: https://philos.onrender.com  # change to your real domain
