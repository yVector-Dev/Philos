{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a class="btn btn-ghost btn-sm" href="{% querystring page=page.previous_page_number %}" rel="prev">← Newer</a>{% else %}<span></span>{% endif %}
  <span class="pagination-info">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-ghost btn-sm" href="{% querystring page=page.next_page_number %}" rel="next">More →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
